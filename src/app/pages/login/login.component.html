<!-- src/app/pages/login/login.component.html -->
<div class="relative min-h-screen w-full flex items-center justify-center overflow-hidden bg-[#111827] text-white p-4 font-sans">
  <!-- Background decorative lines -->
  <div class="absolute top-0 left-0 w-full h-full opacity-20">
    <div class="absolute top-1/2 left-1/2 w-[200%] h-[200%] -translate-x-1/2 -translate-y-1/2">
      <div class="absolute w-full h-full bg-transparent">
        <div class="absolute top-0 left-1/2 w-1/4 h-full bg-gradient-to-r from-transparent to-[#2c3e50]/30 -rotate-45"></div>
        <div class="absolute top-0 left-1/4 w-1/4 h-full bg-gradient-to-r from-transparent to-[#2c3e50]/20 -rotate-45"></div>
        <div class="absolute top-0 left-0 w-1/4 h-full bg-gradient-to-r from-transparent to-[#2c3e50]/10 -rotate-45"></div>
      </div>
    </div>
  </div>

  <main class="relative z-10 w-full max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
    <!-- Left Section: Branding -->
    <div class="flex flex-col items-center lg:items-start text-center lg:text-left">
      <h1 class="text-6xl font-bold text-white tracking-tight">CampusLearn</h1>
      <div class="relative mt-6 w-full max-w-xs h-16 flex items-center justify-center">
        <!-- SVG for the curved line -->
        <svg class="absolute w-full h-full" viewBox="0 0 300 60" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
          <path d="M2 30C2 12.3269 17.3269 2 35 2H265C282.673 2 298 12.3269 298 30" stroke="white" stroke-width="3"/>
        </svg>
        <p class="text-white text-lg tracking-wider">Knowledge Without Limits</p>
      </div>

      <!-- Demo Account Info (Remove in production) -->
      <div class="mt-8 p-4 bg-slate-800/50 rounded-lg max-w-md">
        <h3 class="text-lg font-semibold text-cyan-400 mb-2">Demo Account</h3>
        <p class="text-sm text-slate-300 mb-2">Use this account for testing:</p>
        <div class="text-sm">
          <p><strong>Email:</strong> demo@belgiumcampus.ac.za</p>
          <p><strong>Password:</strong> DemoMcDemo#117</p>
        </div>
        <button 
          (click)="quickLogin('demo@belgiumcampus.ac.za', 'DemoMcDemo#117')"
          class="mt-3 w-full py-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-lg transition-colors text-sm"
          [disabled]="isLoading()">
          Use Demo Account
        </button>
      </div>
    </div>

    <!-- Right Section: Login Form -->
    <div class="w-full max-w-md mx-auto">
      <div class="bg-[#212f45] rounded-3xl shadow-2xl p-8 sm:p-10">
        <h2 class="text-center text-4xl font-bold text-white mb-8">Login</h2>
        
        <!-- Error Message -->
        <div *ngIf="errorMessage()" class="mb-6 p-4 bg-red-500/20 border border-red-500 rounded-lg">
          <p class="text-red-300 text-sm">{{ errorMessage() }}</p>
        </div>

        <form (submit)="$event.preventDefault(); login()">
          <div class="space-y-6">
            <div>
              <input 
                type="email" 
                id="email"
                placeholder="Email (must end with @belgiumcampus.ac.za)"
                [value]="email()"
                (input)="onEmailInput($event)"
                class="w-full px-5 py-3 text-white bg-slate-700/50 rounded-full placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition-shadow duration-300" 
                required
                [disabled]="isLoading()">
            </div>
            <div>
              <input 
                type="password" 
                id="password"
                placeholder="Password"
                [value]="password()"
                (input)="onPasswordInput($event)"
                class="w-full px-5 py-3 text-white bg-slate-700/50 rounded-full placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-slate-500 transition-shadow duration-300"
                required
                [disabled]="isLoading()">
            </div>
          </div>

          <div class="flex items-center justify-between mt-6 text-sm">
            <div class="flex items-center">
              <input 
                type="checkbox" 
                id="rememberMe"
                [checked]="rememberMe()"
                (change)="onRememberMeChange($event)"
                class="h-4 w-4 rounded bg-slate-700 border-slate-600 text-cyan-500 focus:ring-cyan-500 cursor-pointer"
                [disabled]="isLoading()">
              <label for="rememberMe" class="ml-2 text-slate-400 cursor-pointer">Remember me</label>
            </div>
            <a href="#" class="font-medium text-slate-400 hover:text-cyan-400 transition-colors">Forgot password?</a>
          </div>

          <div class="mt-8">
            <p class="text-center text-sm text-slate-400">
              Don't have an account? 
              <a [routerLink]="['/register']" class="font-medium text-cyan-400 hover:underline ml-1">Sign up</a>
            </p>
          </div>
          
          <div class="mt-4">
            <button 
              type="submit" 
              class="w-full py-3 px-4 bg-slate-200 hover:bg-white text-slate-900 font-bold rounded-full transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-white disabled:opacity-50 disabled:cursor-not-allowed"
              [disabled]="isLoading()">
              <span *ngIf="!isLoading()">Log in</span>
              <span *ngIf="isLoading()" class="flex items-center justify-center">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-slate-900" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Signing in...
              </span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
