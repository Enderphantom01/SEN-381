<div class="bg-[#1A202C] text-gray-200 font-sans min-h-screen p-8 relative overflow-hidden" 
     style="background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.03) 50%, rgba(255, 255, 255, 0.03) 75%, transparent 75%, transparent); background-size: 40px 40px;">
  
  <div class="absolute left-6 top-0 bottom-0 w-1 bg-gray-600/50 rounded-full"></div>

  <main class="w-full max-w-3xl mx-auto">
    <!-- Header -->
    <header class="flex justify-between items-center mb-10">
      <h1 class="text-4xl font-bold">Notifications</h1>
      <button class="bg-[#2D3748] hover:bg-slate-600 text-gray-200 font-semibold py-3 px-8 rounded-full shadow-lg transition-transform hover:scale-105">
        Search
      </button>
    </header>

    <!-- Notifications List -->
    <div class="space-y-4">
      @for (notification of notifications(); track notification.id) {
        <div class="bg-[#2D3748] rounded-xl p-6 flex items-center justify-between shadow-lg">
          <div class="flex items-center space-x-4">
            <div class="w-3 h-3 rounded-full flex-shrink-0" [class]="!notification.read ? 'bg-teal-400' : 'bg-transparent'"></div>
            <div>
              <p class="font-bold text-lg text-white">{{ notification.title }}</p>
              <p class="text-gray-400">{{ notification.message }}</p>
            </div>
          </div>
          <button (click)="toggleReadStatus(notification.id)" class="text-white underline font-semibold whitespace-nowrap hover:text-teal-400 transition-colors">
            @if (notification.read) {
              <span>Mark Unread</span>
            } @else {
              <span>Mark Read</span>
            }
          </button>
        </div>
      }
    </div>
  </main>
</div>
